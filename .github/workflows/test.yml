name: tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # uv.lock is committed (reproducibility), so key the cache off it.
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install epykit + test deps
        run: uv sync --python ${{ matrix.python-version }} --extra dev --extra all

      - name: Run pytest (skip slow, with coverage)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --python ${{ matrix.python-version }} pytest -m "not slow" --strict-markers -ra --cov=epykit --cov-report=term-missing

  slow:
    name: pytest slow tier (ubuntu, py3.12)
    # The accuracy / calibration / chain-merge logic lives behind the `slow`
    # marker and is excluded from the matrix `test` job. Run it here on both
    # push AND pull_request (M9) so the statistical guarantees (incl.
    # real-engine null calibration) are exercised BEFORE merge, not only after.
    # It's a single ubuntu/py3.12 job, so the per-PR cost stays bounded; the
    # fast engine-oracle tests (tests/test_engine_oracles.py) additionally run
    # in the full matrix incl. Windows on every PR.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install epykit + test deps
        run: uv sync --python 3.12 --extra dev --extra all

      - name: Run pytest (slow tier)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --python 3.12 pytest -m slow --strict-markers -ra

  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install epykit + dev tools
        run: uv sync --python 3.12 --extra dev --extra all

      - name: Ruff
        run: uv run --python 3.12 ruff check src/

      - name: Mypy
        run: uv run --python 3.12 mypy src/epykit

  benchmark-regen:
    # Engine-regression slice: runs regen_small.py and diffs the
    # output hashes against benchmark/scripts/regen_small_hashes.json.
    # Catches changes to dmc.py / _glm.py / dmr.py that move per-CpG
    # output BEFORE they land in the headline benchmark numbers.
    # See benchmark/scripts/regen_small.py for the slice definition.
    name: benchmark-regen (lr / lr+ hash diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install epykit + benchmark deps
        run: uv sync --python 3.12 --extra dev --extra all

      - name: Run the engine-regression slice (~30s)
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --python 3.12 python benchmark/scripts/regen_small.py

  build:
    # Build the sdist + wheel, validate the package metadata, and smoke-test
    # the installed wheel in a clean environment so a broken sdist, missing
    # package-data, or bad metadata is caught before it reaches PyPI (M-pkg4).
    name: build + wheel smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build sdist + wheel
        run: uv run --python 3.12 --with build python -m build

      - name: Validate package metadata
        run: uv run --python 3.12 --with twine twine check dist/*

      - name: Install the built wheel in a clean env and smoke-test the CLI
        run: |
          uv venv --python 3.12 /tmp/wheelcheck
          uv pip install --python /tmp/wheelcheck/bin/python dist/*.whl
          /tmp/wheelcheck/bin/epykit --help
          /tmp/wheelcheck/bin/python -c "import epykit; print('epykit', epykit.__version__)"
