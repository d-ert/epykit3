[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epykit"
version = "1.0.0"
description = "Parquet-backed WGBS methylation analysis pipeline (Bismark / MethylDackel → DMC/DMR → annotation)"
readme = "README.md"
authors = [ { name = "Deniz Ertuğrul", email = "denizert2000@gmail.com" } ]
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = [
  "methylation",
  "WGBS",
  "bisulfite-sequencing",
  "DMC",
  "DMR",
  "bioinformatics",
  "epigenetics",
  "parquet",
  "polars",
  "scanpy",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  # polars>=1.0 is REQUIRED: the codebase uses DataFrame.pivot(on=...), and the
  # `on=` keyword replaced `columns=` in polars 1.0.0. A <1.0 resolve imports
  # fine but raises TypeError on the first pivot (PCA/UMAP/deconvolve).
  "polars>=1.0,<2",
  "pyarrow>=11.0.0",
  # numpy capped below the next major (3.0) so a future ABI break can't be
  # pulled into a fresh install; numba<->numpy compatibility *within* 2.x is
  # enforced by numba's own per-release numpy cap (pip backtracks to a
  # compatible pair), and uv.lock pins exact versions for reproducible CI.
  "numpy>=1.23,<3",
  "scipy>=1.11",
  # numba>=0.60 is the first release with numpy 2.0 support.
  "numba>=0.60",
  "bioframe>=0.7",
  # Imported directly by annotate.py, filter.py and pl/composer.py; it used to
  # arrive only transitively through bioframe / statsmodels / seaborn. 2.0 is
  # the oldest line exercised (nullable Int64 + to_numpy(na_value=...) in
  # annotate.py); see tests/test_deps_floor.py.
  "pandas>=2.0",
  "pyfaidx>=0.7",
  "statsmodels>=0.14",
  "patsy>=0.5",
  "psutil>=7.2.2",
  "matplotlib>=3.9.4",
  "seaborn>=0.13.2",
  "scikit-learn>=1.6.1",
]

[project.urls]
Homepage = "https://github.com/d-ert/epykit"
Repository = "https://github.com/d-ert/epykit"
Documentation = "https://d-ert.github.io/epykit/"
Issues = "https://github.com/d-ert/epykit/issues"
Changelog = "https://github.com/d-ert/epykit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
report = [
  "jinja2>=3.1",
  "plotly>=5.20",
]
export = [
  "pyBigWig>=0.3.22; sys_platform != 'win32'",
]
anndata = [
  "anndata>=0.10",
  "mudata>=0.2",
]
# Plan 2 §6: visualization extras
viz = [
  "umap-learn>=0.5",
  "scipy>=1.11",
]
# Plan 2 §7: methylKit tabix export (Linux/macOS only; pysam has no Windows wheel)
methylkit = [
  "pysam>=0.22",
]
# Plan 4 #5: BAM ingestion (ASM, methylation entropy). Linux/macOS only.
bam = [
  "pysam>=0.22",
]
# Plan 4 #1: distributed compute via Dask
distributed = [
  "dask[distributed]>=2024.1",
]
# Plan 4 #1: distributed compute via Ray (alternative)
ray = [
  "ray>=2.9",
]
# Plan 4 #2: GPU IRLS via CuPy (CUDA 12). Heavy wheel, not in "all".
# (The only implemented GPU backend is CuPy; there is no JAX backend, so a
# `gpu_jax` extra was removed to avoid pulling a heavy CUDA wheel nothing uses.)
gpu = [
  "cupy-cuda12x>=13.0",
]
# Plan 3 P1-9: dip-test for sex_check unimodal fallback
qc = [
  "diptest",
]
# Parallel permutation FDR: tl.dmc/tl.dmr(empirical_fdr=True, perm_n_jobs>1)
# fan out via joblib. Pure-Python; without it the n_jobs kwarg silently falls
# back to serial execution (a logged warning).
parallel = [
  "joblib>=1.3",
]
all = [
  "jinja2>=3.1",
  "plotly>=5.20",
  "pyBigWig>=0.3.22; sys_platform != 'win32'",
  "anndata>=0.10",
  "mudata>=0.2",
  "umap-learn>=0.5",
  "scipy>=1.11",
  "dask[distributed]>=2024.1",
  "diptest",
  "joblib>=1.3",
]

[project.scripts]
epykit = "epykit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["epykit*"]

[tool.setuptools.package-data]
epykit = ["py.typed", "templates/*.j2", "templates/*.css", "templates/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take more than ~5s; deselect with -m 'not slow'",
]
filterwarnings = [
    # Allow our own DeprecationWarnings through so tests can assert on them
    "default::DeprecationWarning:epykit",
    "default::UserWarning:epykit",
    # Silence third-party deprecation noise that flooded test output
    "ignore::DeprecationWarning:pyarrow",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    ".venv",
    "build",
    "dist",
    "scratch/",
    "**/.claude/**",
    "raw_data",
]

[tool.ruff.lint]
# Start minimal: pyflakes (undefined names, unused imports) only. Once the
# baseline is green in CI, ratchet up to ["F", "E", "W", "I", "B", "UP", "RUF"]
# and add a one-shot autofix commit.
select = ["F"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]
"src/epykit/__init__.py" = ["F401"]  # re-exports
"src/epykit/pl/__init__.py" = ["F401"]  # re-exports

[tool.ruff.lint.isort]
known-first-party = ["epykit"]

[tool.mypy]
# Type-check against the pinned dev interpreter (.python-version). Runtime
# still supports 3.9+ via __future__ annotations and the 3.9 CI leg catches
# runtime-only breakage. The target cannot be lower: numpy >= 2.5 ships
# PEP 695 `type` aliases in its stubs, which mypy only parses at >= 3.12.
python_version = "3.12"
follow_imports = "silent"
ignore_missing_imports = true
no_strict_optional = true
warn_unused_ignores = true

[dependency-groups]
# Contributor tooling, not a user-facing extra (nothing in epykit imports
# these). `uv sync` installs `dev` by default; pip >= 25.1 installs it with
# `pip install -e . --group dev`.
dev = [
    "pytest>=8.4.2",
    "pytest-cov",
    "mypy>=1.19.1",
    "ruff>=0.15.14",
]
# Docs toolchain: `uv run --only-group docs mkdocs build --strict`.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
